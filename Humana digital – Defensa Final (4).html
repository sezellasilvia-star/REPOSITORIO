<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Humana digital – Defensa Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f1ea;--tx:#1d1d1f;--pn:#ffffffcc;--ac:#c2185b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--tx:#f1f1f1;--pn:#20232bcc}}
:root[data-theme="dark"]{--bg:#15171c;--tx:#f1f1f1;--pn:#20232bcc}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif}
#stage{position:relative;height:82vh;min-height:440px;max-height:780px;overflow:hidden;background:#9fd0f5}
#bg{position:absolute;inset:0;background-size:cover;background-position:center}
#av{position:absolute;left:calc(50% + var(--x,0px));bottom:0;height:97%;transform:translateX(-50%);filter:drop-shadow(0 6px 8px #0006)}
#body{animation:br 4s ease-in-out infinite;transform-origin:150px 740px}
@keyframes br{50%{transform:scale(1.004,1.008)}}
#head{transform-origin:150px 170px;animation:hd 5s ease-in-out infinite}
@keyframes hd{50%{transform:rotate(1.2deg)}}
.talk #head{animation:nod 1.2s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(2px)}}
#armR{transform-origin:212px 222px}#armL{transform-origin:88px 222px}
.talk #armR{animation:gr 1.6s ease-in-out infinite}
.talk #armL{animation:gl 2.1s ease-in-out infinite}
@keyframes gr{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes gl{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
#legL{transform-origin:125px 400px}#legR{transform-origin:175px 400px}
.walk{animation:bob .4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.walk #legL{animation:ll .8s ease-in-out infinite}
.walk #legR{animation:ll .8s ease-in-out infinite .4s}
@keyframes ll{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(3deg)}}
.walk #armR{animation:wr .8s ease-in-out infinite}
.walk #armL{animation:wr .8s ease-in-out infinite .4s}
@keyframes wr{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
#eyes{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
#cap:empty{display:none}#cap{position:absolute;left:8px;right:8px;top:8px;background:var(--pn);padding:8px 12px;border-radius:12px;font-size:14px;max-height:30%;overflow:auto;backdrop-filter:blur(6px)}
main{padding:12px;max-width:760px;margin:auto}
.row{display:flex;gap:8px;margin:8px 0}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #8886;background:var(--pn);color:var(--tx);font-size:16px}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
button.s{background:#555}
small{opacity:.7}
</style></head><body>

<div id="cap">Hola, soy tu asistente virtual. Pulsá «Presentar discurso» o haceme una pregunta.</div>
</div>
<main>
<div class="row"><input id="q" placeholder="Escribí tu pregunta… (ej.: ¿qué instrumentos de evaluación usaste?)"><button id="ask">Preguntar</button></div>
<div class="row"><button id="mic" class="s">🎤 Hablar</button><button id="all">▶ Presentar discurso</button><button id="walk">🚶 Caminar</button><button id="test" class="s">🔊 Probar voz</button><button id="stop" class="s">■ Parar</button></div>
</main>
<script>
const D=[
"En primer año de la carrera realicé observación institucional. En segundo año desarrollé mis prácticas profesionalizantes en el primer año del Ciclo Básico del Nivel Secundario, con la profesora Natalie Toledo y junto a una pareja pedagógica.",
"En tercer año realicé mis prácticas en dos etapas. En la primera, en un segundo año del Ciclo Básico, con la profesora Alicia Cano. Luego, con la misma coformadora, realicé mis prácticas en sexto año del Ciclo Orientado.",
"En cuarto año inicié mis prácticas, también en dos etapas. La primera tuvo lugar en tercer año, con la profesora Beatriz Mendoza, y la segunda y última etapa, en quinto año del Ciclo Orientado, también con la coformadora Beatriz Mendoza.",
"A lo largo de estos cuatro años, mi crecimiento personal y profesional se vio atravesado por múltiples factores que contribuyeron a la evolución positiva de mi formación como futura profesora de Lengua y Literatura. Si bien se presentaron ciertos desafíos, considero que forman parte de un aprendizaje significativo para el ejercicio de esta disciplina.",
"Al principio tenía muchas dudas sobre qué debía hacer y cómo hacerlo. Sin embargo, me acompañaron y orientaron modelos a seguir: mis profesores, quienes me enseñaron y guiaron para realizar eficazmente cada tarea frente al aula, con estudiantes de diversas edades que requieren enseñanza y orientación, no solo en contenidos conceptuales, sino también en las distintas necesidades que manifiestan día a día.",
"A la hora de planificar, se atiende especialmente a las Resoluciones Provinciales N.º 314/12 y N.º 536/19, que establecen el enfoque de desarrollo de capacidades y escolarización plena, así como el desarrollo de capacidades socioafectivas y espirituales en el sistema educativo de Formosa, considerando las que responden a las necesidades de cada grupo clase.",
"Planificar las clases ha sido y continúa siendo todo un desafío. Como sostiene Alicia Camilloni, «una clase que invita a pensar a los alumnos es una buena clase», y sus rasgos surgen de la coherencia didáctica entre los objetivos, los medios y las estrategias de enseñanza. Por eso considero fundamental seguir capacitándome cada día más.",
"La incorporación de la IA me ayudó fundamentalmente a dar una forma adecuada a mis redacciones y a aprender a expresar mis ideas de manera más clara y eficaz.",
"En la mayoría de las clases utilicé como instrumento de evaluación una lista de cotejo, en la cual registraba la participación en clase, la entrega de trabajos prácticos en tiempo y forma y la asistencia. Siguiendo a Rebeca Anijovich y Graciela Cappelletti, estos instrumentos cumplen la función clave de «ayudar a registrar las evidencias de aprendizaje» de manera sistemática.",
"En la última clase de mi primera etapa de cuarto año, en el Ciclo Básico, utilicé además de la lista de cotejo una autoevaluación. Los estudiantes reflexionaron sobre su desempeño en la actividad de integración sobre textos argumentativos, su superestructura y los recursos abordados. Como afirman Anijovich y Cappelletti, la autoevaluación requiere habilidades para que el estudiante pueda juzgar su propia producción y desempeño, asumiendo un rol activo en su aprendizaje.",
"Me queda claro que todavía tengo mucho por aprender, pero tengo la predisposición y el compromiso pleno de seguir formándome como profesional para atender de la mejor manera a mis estudiantes, tanto en lo afectivo como en lo efectivo."];
const cap=document.getElementById('cap'),mouth=document.getElementById('mouth'),av=document.getElementById('av'),teeth=document.getElementById('teeth'),jaw=document.getElementById('jaw');
function setJaw(a){mouth.setAttribute('ry',a);teeth.setAttribute('height',Math.min(a,4.5));jaw.setAttribute('transform','translate(0,'+a*.8+')')}
let voice=null,timer=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/es-(AR|419|US|MX)/i.test(x.lang)&&/female|paulina|sabina|helena|elena|google/i.test(x.name))||v.find(x=>x.lang.startsWith('es'))||null}
try{speechSynthesis.onvoiceschanged=pick;pick()}catch(e){}
function mv(on){clearInterval(timer);av.classList.toggle('talk',on);setJaw(0.5);if(!on)return;
timer=setInterval(()=>setJaw(2+Math.random()*10),110)}
function unlock(){try{if(!window._u){window._u=1;speechSynthesis.speak(new SpeechSynthesisUtterance(''))}}catch(e){}}
function say(t){try{speechSynthesis.cancel();cap.textContent='';
if(!window.speechSynthesis){cap.textContent='Este navegador no tiene voz. Abrí el enlace en Chrome.';return}
const parts=(t.match(/[^.!?¿\n]+[.!?]*/g)||[t]).filter(x=>x.trim());let n=parts.length;
parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang='es-AR';if(voice)u.voice=voice;u.pitch=1.15;u.rate=1;
if(i==0)u.onstart=()=>mv(true);
u.onend=()=>{if(--n<=0)mv(false)};
u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted'){mv(false);cap.textContent='No se pudo reproducir la voz ('+e.error+'). Subí el volumen, sacá el modo silencio o abrí el enlace en Chrome.'}};
u.onboundary=ev=>{if(ev.name==='word')setJaw(3+Math.random()*10)};
speechSynthesis.speak(u)});return}catch(e){}
const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';if(voice)u.voice=voice;u.pitch=1.15;u.rate=1;
u.onstart=()=>mv(true);u.onend=u.onerror=()=>mv(false);
u.onboundary=e=>{if(e.name==='word')setJaw(3+Math.random()*10)};
speechSynthesis.speak(u)}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ ]/g,' ');
const stop=new Set('de la el en y a los las un una que por con para se su sus es al lo como mi me del o'.split(' '));
function answer(q){const w=norm(q).split(/\s+/).filter(x=>x.length>2&&!stop.has(x));
if(/hola|buen(os|as)/.test(norm(q))&&w.length<2)return'¡Hola! Qué alegría saludarte. Preguntame sobre mis prácticas, la planificación o la evaluación.';
let best=-1,bi=-1;D.forEach((p,i)=>{const n=norm(p);let s=0;w.forEach(x=>{if(n.includes(x.slice(0,Math.max(4,x.length-2))))s++});if(s>best){best=s;bi=i}});
return best>0?D[bi]:'Esa pregunta no está en mi discurso. Puedo contarte sobre mis coformadoras, la planificación, las resoluciones, la IA o la evaluación.'}
let smp=null,dic=null,tm=null,buf='';const H=[];
(async()=>{try{smp=await claude.use('sample')}catch(e){}
try{dic=await claude.use('dictation')}catch(e){}
if(dic){dic.onPartial(({text})=>{document.getElementById('q').value=(buf+' '+text).trim()});
dic.onFinal(({text})=>{buf=(buf+' '+text).trim();document.getElementById('q').value=buf;clearTimeout(tm);tm=setTimeout(()=>{dic.stop();const t=buf;buf='';converse(t)},1300)});
dic.onState(({state})=>{document.getElementById('mic').textContent=state==='listening'?'🎤 Escuchando…':'🎤 Hablar'})}})();
async function converse(q){
if(!smp){say(answer(q));return}
cap.textContent='Pensando…';
try{const r=await smp([{role:'user',content:'Sos la asistente virtual de una estudiante del Profesorado en Lengua y Literatura que presenta su defensa final de Práctica y Residencia IV. Hablás en primera persona, como ella, en español rioplatense, cálida y alegre, con respuestas orales breves (máximo 4 oraciones, sin listas ni asteriscos). Respondé usando SOLO la información del discurso; si la pregunta no se responde ahí, decilo con amabilidad y ofrecé los temas que sí cubre. Podés saludar y conversar con naturalidad.\n\nDISCURSO:\n'+D.join('\n')+'\n\nCONVERSACIÓN PREVIA:\n'+H.join('\n')+'\n\nPREGUNTA: '+q}],{cache:false,modelTier:'quick'});
const t=r.text.replace(/[*#_]/g,'');H.push('Pregunta: '+q+' | Respuesta: '+t);if(H.length>6)H.shift();say(t)}
catch(e){say(answer(q))}}
const ask=()=>{unlock();const q=document.getElementById('q').value.trim();if(q)converse(q)};
document.getElementById('ask').onclick=ask;
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')ask()};
document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();mv(false)};
document.getElementById('all').onclick=()=>{say(D.join(' '))};
document.getElementById('test').onclick=()=>say('Hola, soy tu asistente virtual. ¿Me escuchás bien?');
let wk=null,wx=0,wd=1;
document.getElementById('walk').onclick=function(){
if(wk){clearInterval(wk);wk=null;av.classList.remove('walk');this.textContent='🚶 Caminar';wx=0;wd=1;av.style.transition='left .7s';av.style.setProperty('--x','0px');setTimeout(()=>{av.style.transition=''},800);return}
av.style.transition='';av.classList.add('walk');this.textContent='⏸ Detenerse';
const lim=document.getElementById('stage').clientWidth*0.3;
wk=setInterval(()=>{wx+=wd*1.6;if(Math.abs(wx)>lim)wd*=-1;av.style.setProperty('--x',wx+'px')},30)};
document.getElementById('mic').onclick=()=>{unlock();if(dic){speechSynthesis.cancel();dic.start().catch(()=>{cap.textContent='Micrófono no permitido. Escribí la pregunta.'});cap.textContent='Escuchando… hablá ahora';return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){cap.textContent='Esta aplicación no admite reconocimiento de voz. Usá el micrófono del teclado del celular en el cuadro de texto, o abrí el enlace en Chrome.';return}
const r=new R();r.lang='es-AR';r.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('q').value=t;converse(t)};
r.onerror=e=>{cap.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'El micrófono está bloqueado aquí. Abrí el enlace directamente en Chrome y permití el micrófono, o usá el micrófono del teclado del celular en el cuadro de texto.':'No pude escuchar ('+e.error+'). Probá de nuevo o usá el micrófono del teclado.'};try{r.start();cap.textContent='Escuchando… hablá ahora'}catch(x){cap.textContent='No se pudo iniciar el micrófono. Usá el micrófono del teclado en el cuadro de texto.'}};
</script></body></html>
